<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estante de Avisos - VentaniYA Soluciones</title>
    <!-- Fuentes: Share Tech Mono para código y Orbitron para títulos -->
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #050814;
            color: #00f3ff;
            font-family: 'Share Tech Mono', monospace;
            margin: 0;
            padding: 20px;
        }
        header {
            text-align: center;
            border-bottom: 2px solid #00f3ff;
            padding-bottom: 15px;
            margin-bottom: 30px;
        }
        h1 {
            font-family: 'Orbitron', sans-serif;
            margin: 0;
            font-size: 1.8rem;
            letter-spacing: 2px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
            max-width: 1300px;
            margin: 0 auto;
        }
        .card {
            background: #0b1120;
            border: 2px solid #00f3ff;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.25);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .badge-aviso {
            background: #ff007f;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.65rem;
            padding: 3px 8px;
            border-radius: 4px;
            margin-bottom: 8px;
            display: inline-block;
            letter-spacing: 1px;
        }
        .img-container {
            width: 100%;
            height: 280px;
            background: #000;
            border: 1px dashed #1e293b;
            border-radius: 4px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        .card img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .live-casio-overlay {
            position: absolute;
            bottom: 10px;
            left: 10px;
            right: 10px;
            background: rgba(5, 8, 20, 0.9);
            border: 1px solid #00f3ff;
            padding: 6px;
            border-radius: 4px;
            text-align: center;
        }
        .casio-time {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            font-weight: 900;
            color: #00f3ff;
            text-shadow: 0 0 10px #00f3ff, 0 0 20px #00f3ff;
            letter-spacing: 1px;
        }
        .casio-date {
            font-size: 0.65rem;
            color: #8be9fd;
            margin-top: 2px;
            letter-spacing: 0.5px;
        }
        .error-msg {
            color: #ff007f;
            font-size: 0.75rem;
            padding: 10px;
            text-align: center;
        }
        .btn {
            display: inline-block;
            background: linear-gradient(90deg, #00f3ff, #0077ff);
            color: #000;
            padding: 12px 20px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 4px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            text-transform: uppercase;
            cursor: pointer;
            border: none;
            margin-top: 5px;
            width: 100%;
            box-sizing: border-box;
        }
        .btn:hover {
            background: #fff;
            box-shadow: 0 0 15px #fff;
        }
        .btn-borrar {
            background: linear-gradient(90deg, #ff007f, #900);
            color: #fff;
            margin-top: 8px;
            font-size: 0.75rem;
            padding: 8px;
        }
        .btn-borrar:hover {
            background: #ff007f;
            box-shadow: 0 0 15px #ff007f;
        }
        .editor-section {
            max-width: 1300px;
            margin: 40px auto 20px auto;
            border-top: 2px dashed #00f3ff;
            padding-top: 25px;
        }
        .editor-box {
            background: #0b1120;
            border: 2px solid #0077ff;
            border-radius: 8px;
            padding: 25px;
            max-width: 650px;
            margin: 0 auto;
            box-shadow: 0 0 15px rgba(0, 119, 255, 0.2);
        }
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 6px;
            font-weight: bold;
            color: #8be9fd;
        }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            background: #050814;
            border: 1px solid #00f3ff;
            color: #00f3ff;
            padding: 10px;
            border-radius: 4px;
            font-family: 'Share Tech Mono', monospace;
            box-sizing: border-box;
            font-size: 0.95rem;
        }
        canvas {
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>VENTANIYA SOLUCIONES - ESTANTE DE AVISOS</h1>
        <p>Sistema de Estampado Temporal, Sello Atómico y Vidriera Pública Permanente</p>
    </header>

    <!-- PANEL DE EDICIÓN Y ESTAMPADO -->
    <div class="editor-section">
        <h2>🛠️ Panel de Edición y Estampado Atómico de Avisos</h2>
        <div class="editor-box">
            <div class="form-group">
                <label for="selectImagen">1. Seleccioná una estampa base del repositorio:</label>
                <select id="selectImagen">
                    <option value="">Cargando opciones...</option>
                </select>
            </div>
            <div class="form-group">
                <label for="textoAviso">2. Escribí el texto del aviso:</label>
                <textarea id="textoAviso" rows="4" placeholder="Ej: ¡GRAN LANZAMIENTO EXCLUSIVO ESTE FIN DE SEMANA!"></textarea>
            </div>
            <div class="form-group">
                <label for="logoAvisador">3. Subir logo del avisador (Opcional):</label>
                <input type="file" id="logoAvisador" accept="image/*">
            </div>
            <button class="btn" id="btnGenerarAviso">⚡ Generar, Sellar y Sumar a la Vidriera</button>
        </div>
    </div>

    <!-- VIDRIERA PÚBLICA -->
    <div class="editor-section" style="border-top: none;">
        <h2>🛒 Vidriera Pública de Estampillas y Avisos Fijos (Permanentes al F5)</h2>
        <div class="grid" id="estanteGrid">
            <div class="card"><div class="error-msg">Cargando vidriera atómica...</div></div>
        </div>
    </div>

    <canvas id="canvasProcesamiento"></canvas>

    <script>
        const usuarioRepo = "ventaniyasoluciones-blip";
        const nombreRepo = "estanteria";
        
        let listaImagenesRepo = [];

        async function inicializarVidriera() {
            await cargarImagenesGitHub();
            renderizarVidrieraCompleta();
        }

        async function cargarImagenesGitHub() {
            const select = document.getElementById('selectImagen');
            const urlApi = `https://api.github.com/repos/${usuarioRepo}/${nombreRepo}/contents/`;

            try {
                const response = await fetch(urlApi);
                if (!response.ok) throw new Error("Error al conectar con GitHub API");
                
                const archivos = await response.json();
                
                // Filtrar solo imágenes válidas
                listaImagenesRepo = archivos.filter(file => {
                    if (file.type !== 'file') return false;
                    const ext = file.name.split('.').pop().toLowerCase();
                    return ['jpg', 'jpeg', 'png', 'webp', 'gif'].includes(ext);
                }).map(file => ({
                    name: file.name,
                    // Usar raw.githubusercontent.com asegura que la imagen cargue sin bloqueos de CORS
                    download_url: `https://raw.githubusercontent.com/${usuarioRepo}/${nombreRepo}/main/${file.name}`
                }));

                if (listaImagenesRepo.length === 0) {
                    throw new Error("No hay imágenes en el array del repositorio");
                }

                llenarSelectImagenes();

            } catch (error) {
                console.warn("Aviso: No se pudo leer la API de GitHub directamente. Activando respaldo de emergencia...", error);
                
                // RESPALDO AUTOMÁTICO: Si la API de GitHub frena la petición, armamos URLs directas con 'main'
                // (Si tu rama principal se llama 'master', podés cambiarlo abajo, pero por defecto GitHub usa 'main')
                listaImagenesRepo = [
                    { name: "estampa1.png", download_url: `https://raw.githubusercontent.com/${usuarioRepo}/${nombreRepo}/main/estampa1.png` },
                    { name: "estampa2.png", download_url: `https://raw.githubusercontent.com/${usuarioRepo}/${nombreRepo}/main/estampa2.png` }
                ];
                
                llenarSelectImagenes();
            }
        }

        function llenarSelectImagenes() {
            const select = document.getElementById('selectImagen');
            select.innerHTML = '';

            listaImagenesRepo.forEach(img => {
                const option = document.createElement('option');
                option.value = img.download_url;
                option.textContent = img.name;
                select.appendChild(option);
            });
        }

        function iniciarRelojCasioEnVivo(idPrefix) {
            setInterval(() => {
                const ahora = new Date();
                const horas = String(ahora.getHours()).padStart(2, '0');
                const minutos = String(ahora.getMinutes()).padStart(2, '0');
                const segundos = String(ahora.getSeconds()).padStart(2, '0');
                const milisegundos = String(Math.floor(ahora.getMilliseconds())).padStart(3, '0');
                
                const dia = String(ahora.getDate()).padStart(2, '0');
                const mes = String(ahora.getMonth() + 1).padStart(2, '0');
                const anio = ahora.getFullYear();

                const timeEl = document.getElementById(`${idPrefix}-time`);
                const dateEl = document.getElementById(`${idPrefix}-date`);

                if (timeEl && dateEl) {
                    timeEl.textContent = `${horas}:${minutos}:${segundos}.${milisegundos}`;
                    dateEl.textContent = `FECHA: ${dia}/${mes}/${anio}`;
                }
            }, 40);
        }

        // MOTOR DE ESTAMPADO Y SELLADO ATÓMICO CON GARANTÍA GRÁFICA
        document.getElementById('btnGenerarAviso').addEventListener('click', () => {
            const select = document.getElementById('selectImagen');
            const textoAviso = document.getElementById('textoAviso').value;
            const inputLogo = document.getElementById('logoAvisador');

            if (!select.value) {
                alert("Por favor seleccioná una imagen base.");
                return;
            }

            const imgUrl = select.value;
            const canvas = document.getElementById('canvasProcesamiento');
            const ctx = canvas.getContext('2d');

            const imgBase = new Image();
            imgBase.crossOrigin = "anonymous";
            imgBase.src = imgUrl + (imgUrl.includes('?') ? '&' : '?') + 't=' + Date.now();

            imgBase.onerror = () => {
                alert("No se pudo cargar la imagen seleccionada desde GitHub. Verificá que el archivo exista en el repositorio.");
            };

            imgBase.onload = () => {
                canvas.width = 1080;
                canvas.height = 1080;
                ctx.drawImage(imgBase, 0, 0, canvas.width, canvas.height);

                const ahora = new Date();
                const horas = String(ahora.getHours()).padStart(2, '0');
                const minutos = String(ahora.getMinutes()).padStart(2, '0');
                const segundos = String(ahora.getSeconds()).padStart(2, '0');
                const milisegundos = String(ahora.getMilliseconds()).padStart(3, '0');
                const timeString = `${horas}:${minutos}:${segundos}.${milisegundos}`;
                
                const dia = String(ahora.getDate()).padStart(2, '0');
                const mes = String(ahora.getMonth() + 1).padStart(2, '0');
                const anio = ahora.getFullYear();
                const dateString = `${dia}/${mes}/${anio}`;

                const hashRespaldo = "HASH-ATOMIC-" + Math.random().toString(36).substring(2, 10).toUpperCase() + "-" + ahora.getTime().toString(36).toUpperCase();

                // 1. FRANJA INFERIOR TÉCNICA (Reloj Casio + Fecha + Hash)
                const panelAlto = 190;
                ctx.fillStyle = "rgba(5, 8, 20, 0.95)";
                ctx.fillRect(0, canvas.height - panelAlto, canvas.width, panelAlto);

                ctx.strokeStyle = "#00f3ff";
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(0, canvas.height - panelAlto);
                ctx.lineTo(canvas.width, canvas.height - panelAlto);
                ctx.stroke();

                ctx.fillStyle = "#00f3ff";
                ctx.shadowColor = "#00f3ff";
                ctx.shadowBlur = 15;
                ctx.font = "bold 44px 'Orbitron', sans-serif";
                ctx.textAlign = "left";
                ctx.fillText(`⏱️ ${timeString}`, 35, canvas.height - 125);
                ctx.shadowBlur = 0;

                ctx.font = "20px 'Share Tech Mono', monospace";
                ctx.fillStyle = "#8be9fd";
                ctx.fillText(`📅 FECHA: ${dateString}`, 35, canvas.height - 80);
                ctx.fillStyle = "#00f3ff";
                ctx.fillText(`🔒 ID HASH RESPALDO: ${hashRespaldo}`, 35, canvas.height - 40);

                // 2. SELLO POSTAL ATÓMICO CIRCULAR
                const centroX = canvas.width - 130;
                const centroY = canvas.height - 95;
                const radioSello = 75;

                ctx.save();
                ctx.beginPath();
                ctx.arc(centroX, centroY, radioSello, 0, Math.PI * 2);
                ctx.fillStyle = "rgba(5, 8, 20, 0.9)";
                ctx.fill();
                ctx.lineWidth = 4;
                ctx.strokeStyle = "#00f3ff";
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(centroX, centroY, radioSello - 8, 0, Math.PI * 2);
                ctx.setLineDash([4, 4]);
                ctx.strokeStyle = "#8be9fd";
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.setLineDash([]);

                ctx.fillStyle = "#00f3ff";
                ctx.font = "bold 13px 'Orbitron', sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("VENTANIYA", centroX, centroY - 20);
                ctx.font = "bold 11px 'Share Tech Mono', monospace";
                ctx.fillStyle = "#ffffff";
                ctx.fillText("SOLUCIONES", centroX, centroY - 2);
                ctx.font = "9px 'Share Tech Mono', monospace";
                ctx.fillStyle = "#00f3ff";
                ctx.fillText("★ CERTIFICADO ★", centroX, centroY + 22);
                ctx.restore();

                // 3. AVISO SUPERIOR
                if (textoAviso.trim() !== "") {
                    const boxAvisoY = 50;
                    const boxAvisoAlto = 140;

                    ctx.fillStyle = "rgba(5, 8, 20, 0.9)";
                    ctx.fillRect(40, boxAvisoY, canvas.width - 80, boxAvisoAlto);
                    
                    ctx.strokeStyle = "#00f3ff";
                    ctx.lineWidth = 3;
                    ctx.strokeRect(40, boxAvisoY, canvas.width - 80, boxAvisoAlto);

                    ctx.fillStyle = "#ffffff";
                    ctx.shadowColor = "#00f3ff";
                    ctx.shadowBlur = 10;
                    ctx.font = "bold 36px 'Share Tech Mono', monospace";
                    ctx.textAlign = "center";

                    wrapText(ctx, textoAviso, canvas.width / 2, boxAvisoY + 45, canvas.width - 120, 42);
                    ctx.shadowBlur = 0;
                }

                // 4. LOGO Y GUARDADO
                const procesarFinalizacion = () => {
                    const dataUrlFinal = canvas.toDataURL("image/png");
                    guardarYRenderizarAviso(dataUrlFinal, textoAviso || "Aviso Certificado");
                };

                if (inputLogo.files && inputLogo.files[0]) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const imgLogo = new Image();
                        imgLogo.src = e.target.result;
                        imgLogo.onload = () => {
                            const logoSize = 130;
                            ctx.drawImage(imgLogo, 60, 210, logoSize, logoSize);
                            procesarFinalizacion();
                        };
                        imgLogo.onerror = () => procesarFinalizacion();
                    };
                    reader.readAsDataURL(inputLogo.files[0]);
                } else {
                    procesarFinalizacion();
                }
            };
        });

        function wrapText(context, text, x, y, maxWidth, lineHeight) {
            const words = text.split(' ');
            let line = '';
            let currentY = y;

            for(let n = 0; n < words.length; n++) {
                let testLine = line + words[n] + ' ';
                let metrics = context.measureText(testLine);
                let testWidth = metrics.width;
                if (testWidth > maxWidth && n > 0) {
                    context.fillText(line, x, currentY);
                    line = words[n] + ' ';
                    currentY += lineHeight;
                } else {
                    line = testLine;
                }
            }
            context.fillText(line, x, currentY);
        }

        function guardarYRenderizarAviso(dataUrl, descripcion) {
            let avisosGuardados = JSON.parse(localStorage.getItem('ventaniya_avisos_fijos')) || [];
            
            const nuevoAviso = {
                id: Date.now(),
                imagen: dataUrl,
                texto: descripcion,
                fecha: new Date().toLocaleString()
            };

            avisosGuardados.unshift(nuevoAviso);
            localStorage.setItem('ventaniya_avisos_fijos', JSON.stringify(avisosGuardados));

            document.getElementById('textoAviso').value = '';
            document.getElementById('logoAvisador').value = '';

            alert("¡Aviso procesado, sellado con éxito y sumado a la vidriera!");
            renderizarVidrieraCompleta();
        }

        function renderizarVidrieraCompleta() {
            const grid = document.getElementById('estanteGrid');
            grid.innerHTML = ''; 

            let avisosGuardados = JSON.parse(localStorage.getItem('ventaniya_avisos_fijos')) || [];
            
            // 1. Avisos fijos guardados
            avisosGuardados.forEach((aviso) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div>
                        <span class="badge-aviso">⚡ AVISO SELLADO FIJO</span>
                    </div>
                    <div class="img-container">
                        <img src="${aviso.imagen}" alt="Aviso Sellado">
                    </div>
                    <div style="font-size: 0.8rem; color: #fff; text-align: left; margin-bottom: 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
                        💬 ${aviso.texto}
                    </div>
                    <div>
                        <a href="${aviso.imagen}" download="aviso-sellado-ventaniya-${aviso.id}.png" class="btn">📥 Descargar Sellado</a>
                        <button class="btn btn-borrar" onclick="borrarAvisoFijo(${aviso.id})">🗑️ Quitar de la Vidriera</button>
                    </div>
                `;
                grid.appendChild(card);
            });

            // 2. Estampas del repositorio con reloj dinámico
            if (listaImagenesRepo.length > 0) {
                listaImagenesRepo.forEach((img, index) => {
                    const cardId = `reloj-repo-${index}`;
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div>
                            <span class="badge-aviso" style="background: #0077ff;">🖼️ ESTAMPA ORIGINAL REPO</span>
                        </div>
                        <div class="img-container">
                            <img src="${img.download_url}" alt="${img.name}">
                            <div class="live-casio-overlay">
                                <div class="casio-time" id="${cardId}-time">00:00:00.000</div>
                                <div class="casio-date" id="${cardId}-date">--/--/----</div>
                            </div>
                        </div>
                        <div>
                            <a href="${img.download_url}" download="${img.name}" class="btn" target="_blank">📥 Descargar Original</a>
                        </div>
                    `;
                    grid.appendChild(card);
                    iniciarRelojCasioEnVivo(cardId);
                });
            }

            if (avisosGuardados.length === 0 && listaImagenesRepo.length === 0) {
                grid.innerHTML = '<div class="card"><div class="error-msg">No hay estampillas ni avisos en la vidriera.</div></div>';
            }
        }

        window.borrarAvisoFijo = function(id) {
            if (confirm("¿Estás seguro de quitar este aviso de la vidriera?")) {
                let avisosGuardados = JSON.parse(localStorage.getItem('ventaniya_avisos_fijos')) || [];
                avisosGuardados = avisosGuardados.filter(a => a.id !== id);
                localStorage.setItem('ventaniya_avisos_fijos', JSON.stringify(avisosGuardados));
                renderizarVidrieraCompleta();
            }
        };

        inicializarVidriera();
    </script>

</body>
</html>
