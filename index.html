<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estante de Avisos - VentaniYA Soluciones</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #050814;
            color: #00f3ff;
            font-family: 'Share Tech Mono', monospace;
            margin: 0;
            padding: 20px;
        }
        header {
            text-align: center;
            border-bottom: 2px solid #00f3ff;
            padding-bottom: 15px;
            margin-bottom: 30px;
        }
        h1 {
            font-family: 'Orbitron', sans-serif;
            margin: 0;
            font-size: 1.8rem;
            letter-spacing: 2px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 25px;
            max-width: 1300px;
            margin: 0 auto;
        }
        .card {
            background: #0b1120;
            border: 2px solid #00f3ff;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.25);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .badge-repo {
            background: #ff007f;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.65rem;
            padding: 3px 8px;
            border-radius: 4px;
            margin-bottom: 8px;
            display: inline-block;
            letter-spacing: 1px;
        }
        .img-container {
            width: 100%;
            height: 280px;
            background: #000;
            border: 1px dashed #1e293b;
            border-radius: 4px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        .card img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .live-casio-overlay {
            position: absolute;
            bottom: 8px;
            left: 8px;
            right: 8px;
            background: rgba(5, 8, 20, 0.9);
            border: 1px solid #00f3ff;
            padding: 5px;
            border-radius: 4px;
            text-align: center;
        }
        .casio-time {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            font-weight: 900;
            color: #00f3ff;
            text-shadow: 0 0 8px #00f3ff;
        }
        .casio-date {
            font-size: 0.6rem;
            color: #8be9fd;
        }
        .info-panel-preview {
            background: rgba(0, 243, 255, 0.05);
            border: 1px solid #00f3ff;
            padding: 8px;
            border-radius: 4px;
            margin-bottom: 12px;
            text-align: left;
            font-size: 0.8rem;
        }
        .btn-group {
            display: flex;
            gap: 8px;
        }
        .btn {
            flex: 1;
            background: linear-gradient(90deg, #00f3ff, #0077ff);
            color: #000;
            padding: 10px 10px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 4px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            text-transform: uppercase;
            cursor: pointer;
            border: none;
            box-sizing: border-box;
        }
        .btn-secundario {
            background: #ff007f;
            color: #fff;
        }
        .btn:hover {
            opacity: 0.85;
            box-shadow: 0 0 10px #00f3ff;
        }
        .editor-section {
            max-width: 1300px;
            margin: 40px auto 20px auto;
            border-top: 2px dashed #00f3ff;
            padding-top: 25px;
        }
        .editor-box {
            background: #0b1120;
            border: 2px solid #0077ff;
            border-radius: 8px;
            padding: 25px;
            max-width: 650px;
            margin: 0 auto;
            box-shadow: 0 0 15px rgba(0, 119, 255, 0.2);
        }
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 6px;
            font-weight: bold;
            color: #8be9fd;
        }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            background: #050814;
            border: 1px solid #00f3ff;
            color: #00f3ff;
            padding: 10px;
            border-radius: 4px;
            font-family: 'Share Tech Mono', monospace;
            box-sizing: border-box;
            font-size: 0.95rem;
        }
        canvas {
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>VENTANIYA SOLUCIONES - ESTANTE DE AVISOS</h1>
        <p>Sistema de Gestión y Sobreescritura en Vidriera</p>
    </header>

    <!-- PANEL DE EDICIÓN GLOBAL -->
    <div class="editor-section">
        <h2>🛠️ Panel de Edición de Datos Fijos</h2>
        <div class="editor-box">
            <div class="form-group">
                <label for="selectImagen">1. Seleccioná la imagen del repositorio:</label>
                <select id="selectImagen">
                    <option value="">Cargando catálogo...</option>
                </select>
            </div>
            <div class="form-group">
                <label for="inputTexto">2. Texto principal del aviso:</label>
                <textarea id="inputTexto" rows="2" placeholder="Ej: ¡OFERTA ESPECIAL EN ESTANTE!"></textarea>
            </div>
            <div class="form-group">
                <label for="inputDireccion">3. Dirección:</label>
                <input type="text" id="inputDireccion" placeholder="Ej: Av. Principal 1234, Local 5">
            </div>
            <div class="form-group">
                <label for="inputTelefono">4. Teléfono / Contacto:</label>
                <input type="text" id="inputTelefono" placeholder="Ej: +54 9 11 1234-5678">
            </div>
            <div class="form-group">
                <label for="inputLogo">5. Logo del avisador (Opcional):</label>
                <input type="file" id="inputLogo" accept="image/*">
            </div>
            <button class="btn" id="btnGuardarFijo" style="width: 100%; padding: 12px; font-size: 0.85rem;">💾 Fijar / Actualizar Datos en esta Imagen</button>
        </div>
    </div>

    <!-- VIDRIERA PÚBLICA -->
    <div class="editor-section" style="border-top: none;">
        <h2>🛒 Vidriera Dinámica del Repositorio</h2>
        <div class="grid" id="estanteGrid"></div>
    </div>

    <canvas id="canvasProcesamiento"></canvas>

    <script>
        const usuarioRepo = "ventaniyasoluciones-blip";
        const nombreRepo = "estanteria";
        let imagenesRepo = [];

        async function inicializar() {
            await cargarImagenesRepo();
        }

        async function cargarImagenesRepo() {
            const urlApi = `https://api.github.com/repos/${usuarioRepo}/${nombreRepo}/git/trees/main?recursive=1`;
            try {
                const response = await fetch(urlApi);
                const data = await response.json();
                if (data && data.tree) {
                    imagenesRepo = data.tree
                        .filter(item => {
                            if (item.type !== 'blob') return false;
                            const ext = item.path.split('.').pop().toLowerCase();
                            return ['jpg', 'jpeg', 'png', 'webp', 'gif'].includes(ext);
                        })
                        .map(item => ({
                            name: item.path,
                            download_url: `https://raw.githubusercontent.com/${usuarioRepo}/${nombreRepo}/main/${item.path}`
                        }));
                }
            } catch (e) {
                console.error("Error al leer repo", e);
            }

            const select = document.getElementById('selectImagen');
            select.innerHTML = '';
            if (imagenesRepo.length === 0) {
                select.innerHTML = '<option value="">No hay imágenes</option>';
            } else {
                imagenesRepo.forEach((img) => {
                    const opt = document.createElement('option');
                    opt.value = img.name;
                    opt.textContent = img.name;
                    select.appendChild(opt);
                });
            }

            renderizarVidriera();
        }

        function iniciarReloj(idPrefix) {
            setInterval(() => {
                const ahora = new Date();
                const horas = String(ahora.getHours()).padStart(2, '0');
                const minutos = String(ahora.getMinutes()).padStart(2, '0');
                const segundos = String(ahora.getSeconds()).padStart(2, '0');
                const milisegundos = String(Math.floor(ahora.getMilliseconds())).padStart(3, '0');
                const dia = String(ahora.getDate()).padStart(2, '0');
                const mes = String(ahora.getMonth() + 1).padStart(2, '0');
                const anio = ahora.getFullYear();

                const timeEl = document.getElementById(`${idPrefix}-time`);
                const dateEl = document.getElementById(`${idPrefix}-date`);
                if (timeEl && dateEl) {
                    timeEl.textContent = `${horas}:${minutos}:${segundos}.${milisegundos}`;
                    dateEl.textContent = `FECHA: ${dia}/${mes}/${anio}`;
                }
            }, 40);
        }

        // GUARDAR / FIJAR DATOS EN LOCALSTORAGE ASOCIADOS A CADA IMAGEN
        document.getElementById('btnGuardarFijo').addEventListener('click', () => {
            const nombreImg = document.getElementById('selectImagen').value;
            const texto = document.getElementById('inputTexto').value;
            const direccion = document.getElementById('inputDireccion').value;
            const telefono = document.getElementById('inputTelefono').value;
            const inputLogo = document.getElementById('inputLogo');

            if (!nombreImg) {
                alert("Seleccioná una imagen del repositorio.");
                return;
            }

            let datosFijos = JSON.parse(localStorage.getItem('ventaniya_datos_fijos')) || {};

            const guardarRegistro = (logoBase64 = null) => {
                datosFijos[nombreImg] = {
                    texto: texto,
                    direccion: direccion,
                    telefono: telefono,
                    logo: logoBase64 || (datosFijos[nombreImg] ? datosFijos[nombreImg].logo : null)
                };
                localStorage.setItem('ventaniya_datos_fijos', JSON.stringify(datosFijos));
                alert("¡Datos fijados con éxito en la imagen!");
                renderizarVidriera();
            };

            if (inputLogo.files && inputLogo.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    guardarRegistro(e.target.result);
                };
                reader.readAsDataURL(inputLogo.files[0]);
            } else {
                guardarRegistro();
            }
        });

        function renderizarVidriera() {
            const grid = document.getElementById('estanteGrid');
            grid.innerHTML = '';

            let datosFijos = JSON.parse(localStorage.getItem('ventaniya_datos_fijos')) || {};

            if (imagenesRepo.length === 0) {
                grid.innerHTML = '<div class="card"><div style="color: #ff007f;">No se encontraron imágenes en el repositorio.</div></div>';
                return;
            }

            imagenesRepo.forEach((img, index) => {
                const idReloj = `repo-rel-${index}`;
                const config = datosFijos[img.name] || { texto: '', direccion: '', telefono: '', logo: null };

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div><span class="badge-repo">🖼️ ${img.name}</span></div>
                    
                    <div class="img-container">
                        <img src="${img.download_url}" alt="${img.name}" id="img-base-${index}">
                        <div class="live-casio-overlay">
                            <div class="casio-time" id="${idReloj}-time">00:00:00.000</div>
                            <div class="casio-date" id="${idReloj}-date">--/--/----</div>
                        </div>
                    </div>

                    <div class="info-panel-preview">
                        <div><b>💬 Aviso:</b> ${config.texto || '<i>Sin aviso configurado</i>'}</div>
                        <div><b>📍 Dir:</b> ${config.direccion || '-'}</div>
                        <div><b>📞 Tel:</b> ${config.telefono || '-'}</div>
                    </div>

                    <div class="btn-group">
                        <button class="btn" onclick="cargarEnEditor('${img.name}')">✏️ Editar</button>
                        <button class="btn btn-secundario" onclick="descargarEstampaCompleta('${img.download_url}', '${config.texto}', '${config.direccion}', '${config.telefono}', '${config.logo || ''}')">📥 Descargar</button>
                    </div>
                `;
                grid.appendChild(card);
                iniciarReloj(idReloj);
            });
        }

        window.cargarEnEditor = function(nombreImg) {
            document.getElementById('selectImagen').value = nombreImg;
            let datosFijos = JSON.parse(localStorage.getItem('ventaniya_datos_fijos')) || {};
            const config = datosFijos[nombreImg] || { texto: '', direccion: '', telefono: '' };
            document.getElementById('inputTexto').value = config.texto;
            document.getElementById('inputDireccion').value = config.direccion;
            document.getElementById('inputTelefono').value = config.telefono;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.descargarEstampaCompleta = function(urlImg, texto, direccion, telefono, logoBase64) {
            const imgBase = new Image();
            imgBase.crossOrigin = "anonymous";
            imgBase.src = urlImg + "?t=" + Date.now();

            imgBase.onload = () => {
                const canvas = document.getElementById('canvasProcesamiento');
                const ctx = canvas.getContext('2d');
                canvas.width = 1080;
                canvas.height = 1080;
                ctx.drawImage(imgBase, 0, 0, canvas.width, canvas.height);

                const ahora = new Date();
                const timeString = `${String(ahora.getHours()).padStart(2, '0')}:${String(ahora.getMinutes()).padStart(2, '0')}:${String(ahora.getSeconds()).padStart(2, '0')}.${String(ahora.getMilliseconds()).padStart(3, '0')}`;
                const dateString = `${String(ahora.getDate()).padStart(2, '0')}/${String(ahora.getMonth() + 1).padStart(2, '0')}/${ahora.getFullYear()}`;
                const hashRespaldo = "HASH-" + Math.random().toString(36).substring(2, 10).toUpperCase();

                // Franja inferior con línea de tiempo y hash
                ctx.fillStyle = "rgba(5, 8, 20, 0.95)";
                ctx.fillRect(0, canvas.height - 190, canvas.width, 190);
                ctx.strokeStyle = "#00f3ff";
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(0, canvas.height - 190);
                ctx.lineTo(canvas.width, canvas.height - 190);
                ctx.stroke();

                ctx.fillStyle = "#00f3ff";
                ctx.font = "bold 44px 'Orbitron', sans-serif";
                ctx.fillText(`⏱️ ${timeString}`, 35, canvas.height - 125);

                ctx.font = "20px 'Share Tech Mono', monospace";
                ctx.fillStyle = "#8be9fd";
                ctx.fillText(`📅 FECHA: ${dateString}`, 35, canvas.height - 80);
                ctx.fillStyle = "#00f3ff";
                ctx.fillText(`🔒 ID HASH: ${hashRespaldo}`, 35, canvas.height - 40);

                // Sello circular
                const cx = canvas.width - 130, cy = canvas.height - 95;
                ctx.beginPath();
                ctx.arc(cx, cy, 75, 0, Math.PI * 2);
                ctx.fillStyle = "rgba(5, 8, 20, 0.9)";
                ctx.fill();
                ctx.lineWidth = 4;
                ctx.strokeStyle = "#00f3ff";
                ctx.stroke();

                ctx.fillStyle = "#00f3ff";
                ctx.font = "bold 13px 'Orbitron', sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("VENTANIYA", cx, cy - 20);
                ctx.font = "bold 11px 'Share Tech Mono', monospace";
                ctx.fillStyle = "#fff";
                ctx.fillText("SOLUCIONES", cx, cy - 2);

                // Bloque superior de aviso, dirección y teléfono
                if (texto || direccion || telefono) {
                    ctx.fillStyle = "rgba(5, 8, 20, 0.9)";
                    ctx.fillRect(40, 40, canvas.width - 80, 200);
                    ctx.strokeStyle = "#00f3ff";
                    ctx.lineWidth = 3;
                    ctx.strokeRect(40, 40, canvas.width - 80, 200);

                    ctx.fillStyle = "#fff";
                    ctx.font = "bold 30px 'Share Tech Mono', monospace";
                    ctx.textAlign = "left";
                    ctx.fillText(texto || "", 60, 90);

                    ctx.font = "22px 'Share Tech Mono', monospace";
                    ctx.fillStyle = "#8be9fd";
                    if (direccion) ctx.fillText(`📍 ${direccion}`, 60, 145);
                    if (telefono) ctx.fillText(`📞 ${telefono}`, 60, 185);
                }

                // Logo si existe
                if (logoBase64 && logoBase64 !== "null") {
                    const imgLogo = new Image();
                    imgLogo.src = logoBase64;
                    imgLogo.onload = () => {
                        ctx.drawImage(imgLogo, canvas.width - 200, 60, 120, 120);
                        dispararDescarga(canvas);
                    };
                    imgLogo.onerror = () => dispararDescarga(canvas);
                } else {
                    dispararDescarga(canvas);
                }
            };
        }

        function dispararDescarga(canvas) {
            const link = document.createElement('a');
            link.download = `estampa-certificada-${Date.now()}.png`;
            link.href = canvas.toDataURL("image/png");
            link.click();
        }

        inicializar();
    </script>
</body>
</html>
