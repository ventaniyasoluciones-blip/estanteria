<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estante de Avisos - VentaniYA Soluciones</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #050814;
            color: #00f3ff;
            font-family: 'Share Tech Mono', monospace;
            margin: 0;
            padding: 20px;
        }
        header {
            text-align: center;
            border-bottom: 2px solid #00f3ff;
            padding-bottom: 15px;
            margin-bottom: 30px;
        }
        h1 {
            font-family: 'Orbitron', sans-serif;
            margin: 0;
            font-size: 1.8rem;
            letter-spacing: 2px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
            max-width: 1300px;
            margin: 0 auto;
        }
        .card {
            background: #0b1120;
            border: 2px solid #00f3ff;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.25);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .badge-aviso {
            background: #ff007f;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.65rem;
            padding: 3px 8px;
            border-radius: 4px;
            margin-bottom: 8px;
            display: inline-block;
            letter-spacing: 1px;
        }
        .img-container {
            width: 100%;
            height: 280px;
            background: #000;
            border: 1px dashed #1e293b;
            border-radius: 4px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        .card img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .live-casio-overlay {
            position: absolute;
            bottom: 10px;
            left: 10px;
            right: 10px;
            background: rgba(5, 8, 20, 0.9);
            border: 1px solid #00f3ff;
            padding: 6px;
            border-radius: 4px;
            text-align: center;
        }
        .casio-time {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            font-weight: 900;
            color: #00f3ff;
            text-shadow: 0 0 10px #00f3ff, 0 0 20px #00f3ff;
            letter-spacing: 1px;
        }
        .casio-date {
            font-size: 0.65rem;
            color: #8be9fd;
            margin-top: 2px;
            letter-spacing: 0.5px;
        }
        .btn {
            display: inline-block;
            background: linear-gradient(90deg, #00f3ff, #0077ff);
            color: #000;
            padding: 12px 20px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 4px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            text-transform: uppercase;
            cursor: pointer;
            border: none;
            margin-top: 5px;
            width: 100%;
            box-sizing: border-box;
        }
        .btn:hover {
            background: #fff;
            box-shadow: 0 0 15px #fff;
        }
        .btn-borrar {
            background: linear-gradient(90deg, #ff007f, #900);
            color: #fff;
            margin-top: 8px;
            font-size: 0.75rem;
            padding: 8px;
        }
        .editor-section {
            max-width: 1300px;
            margin: 40px auto 20px auto;
            border-top: 2px dashed #00f3ff;
            padding-top: 25px;
        }
        .editor-box {
            background: #0b1120;
            border: 2px solid #0077ff;
            border-radius: 8px;
            padding: 25px;
            max-width: 650px;
            margin: 0 auto;
            box-shadow: 0 0 15px rgba(0, 119, 255, 0.2);
        }
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 6px;
            font-weight: bold;
            color: #8be9fd;
        }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            background: #050814;
            border: 1px solid #00f3ff;
            color: #00f3ff;
            padding: 10px;
            border-radius: 4px;
            font-family: 'Share Tech Mono', monospace;
            box-sizing: border-box;
            font-size: 0.95rem;
        }
        canvas {
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>VENTANIYA SOLUCIONES - ESTANTE DE AVISOS</h1>
        <p>Sistema de Estampado y Vidriera Pública</p>
    </header>

    <div class="editor-section">
        <h2>🛠️ Panel de Edición y Sellado</h2>
        <div class="editor-box">
            <div class="form-group">
                <label for="selectImagen">1. Seleccioná la estampa base del repositorio:</label>
                <select id="selectImagen">
                    <option value="">Buscando imagen...</option>
                </select>
            </div>
            <div class="form-group">
                <label for="textoAviso">2. Escribí el texto del aviso:</label>
                <textarea id="textoAviso" rows="4" placeholder="Ej: ¡GRAN LANZAMIENTO EXCLUSIVO!"></textarea>
            </div>
            <div class="form-group">
                <label for="logoAvisador">3. Subir logo del avisador (Opcional):</label>
                <input type="file" id="logoAvisador" accept="image/*">
            </div>
            <button class="btn" id="btnGenerarAviso">⚡ Generar Aviso y Sumar a la Vidriera</button>
        </div>
    </div>

    <div class="editor-section" style="border-top: none;">
        <h2>🛒 Vidriera Pública</h2>
        <div class="grid" id="estanteGrid"></div>
    </div>

    <canvas id="canvasProcesamiento"></canvas>

    <script>
        const usuarioRepo = "ventaniyasoluciones-blip";
        const nombreRepo = "estanteria";
        let estampaRepo = null;

        async function inicializar() {
            await detectarEstampaRepo();
            renderizarVidriera();
        }

        async function detectarEstampaRepo() {
            const urlApi = `https://api.github.com/repos/${usuarioRepo}/${nombreRepo}/git/trees/main?recursive=1`;
            try {
                const response = await fetch(urlApi);
                const data = await response.json();
                if (data && data.tree) {
                    const imagenEncontrada = data.tree.find(item => {
                        if (item.type !== 'blob') return false;
                        const ext = item.path.split('.').pop().toLowerCase();
                        return ['jpg', 'jpeg', 'png', 'webp', 'gif'].includes(ext);
                    });

                    if (imagenEncontrada) {
                        estampaRepo = {
                            name: imagenEncontrada.path,
                            download_url: `https://raw.githubusercontent.com/${usuarioRepo}/${nombreRepo}/main/${imagenEncontrada.path}`
                        };
                    }
                }
            } catch (e) {
                console.warn("Fallo de API, usando respaldo directo.");
            }

            // Respaldo por si la API falla: busca un archivo común en la raíz
            if (!estampaRepo) {
                estampaRepo = {
                    name: "estampa.png",
                    download_url: `https://raw.githubusercontent.com/${usuarioRepo}/${nombreRepo}/main/estampa.png`
                };
            }

            const select = document.getElementById('selectImagen');
            select.innerHTML = `<option value="${estampaRepo.download_url}">${estampaRepo.name}</option>`;
        }

        function iniciarReloj(idPrefix) {
            setInterval(() => {
                const ahora = new Date();
                const horas = String(ahora.getHours()).padStart(2, '0');
                const minutos = String(ahora.getMinutes()).padStart(2, '0');
                const segundos = String(ahora.getSeconds()).padStart(2, '0');
                const milisegundos = String(Math.floor(ahora.getMilliseconds())).padStart(3, '0');
                const dia = String(ahora.getDate()).padStart(2, '0');
                const mes = String(ahora.getMonth() + 1).padStart(2, '0');
                const anio = ahora.getFullYear();

                const timeEl = document.getElementById(`${idPrefix}-time`);
                const dateEl = document.getElementById(`${idPrefix}-date`);
                if (timeEl && dateEl) {
                    timeEl.textContent = `${horas}:${minutos}:${segundos}.${milisegundos}`;
                    dateEl.textContent = `FECHA: ${dia}/${mes}/${anio}`;
                }
            }, 40);
        }

        document.getElementById('btnGenerarAviso').addEventListener('click', () => {
            const textoAviso = document.getElementById('textoAviso').value;
            const inputLogo = document.getElementById('logoAvisador');

            if (!estampaRepo) {
                alert("No hay estampa disponible.");
                return;
            }

            const imgBase = new Image();
            imgBase.crossOrigin = "anonymous";
            imgBase.src = estampaRepo.download_url + "?t=" + Date.now();

            imgBase.onload = () => {
                const canvas = document.getElementById('canvasProcesamiento');
                const ctx = canvas.getContext('2d');
                canvas.width = 1080;
                canvas.height = 1080;
                ctx.drawImage(imgBase, 0, 0, canvas.width, canvas.height);

                const ahora = new Date();
                const timeString = `${String(ahora.getHours()).padStart(2, '0')}:${String(ahora.getMinutes()).padStart(2, '0')}:${String(ahora.getSeconds()).padStart(2, '0')}.${String(ahora.getMilliseconds()).padStart(3, '0')}`;
                const dateString = `${String(ahora.getDate()).padStart(2, '0')}/${String(ahora.getMonth() + 1).padStart(2, '0')}/${ahora.getFullYear()}`;
                const hashRespaldo = "HASH-" + Math.random().toString(36).substring(2, 10).toUpperCase();

                // Franja inferior
                ctx.fillStyle = "rgba(5, 8, 20, 0.95)";
                ctx.fillRect(0, canvas.height - 190, canvas.width, 190);
                ctx.strokeStyle = "#00f3ff";
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(0, canvas.height - 190);
                ctx.lineTo(canvas.width, canvas.height - 190);
                ctx.stroke();

                ctx.fillStyle = "#00f3ff";
                ctx.font = "bold 44px 'Orbitron', sans-serif";
                ctx.fillText(`⏱️ ${timeString}`, 35, canvas.height - 125);

                ctx.font = "20px 'Share Tech Mono', monospace";
                ctx.fillStyle = "#8be9fd";
                ctx.fillText(`📅 FECHA: ${dateString}`, 35, canvas.height - 80);
                ctx.fillStyle = "#00f3ff";
                ctx.fillText(`🔒 ID HASH: ${hashRespaldo}`, 35, canvas.height - 40);

                // Sello circular
                const cx = canvas.width - 130, cy = canvas.height - 95;
                ctx.beginPath();
                ctx.arc(cx, cy, 75, 0, Math.PI * 2);
                ctx.fillStyle = "rgba(5, 8, 20, 0.9)";
                ctx.fill();
                ctx.lineWidth = 4;
                ctx.strokeStyle = "#00f3ff";
                ctx.stroke();

                ctx.fillStyle = "#00f3ff";
                ctx.font = "bold 13px 'Orbitron', sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("VENTANIYA", cx, cy - 20);
                ctx.font = "bold 11px 'Share Tech Mono', monospace";
                ctx.fillStyle = "#fff";
                ctx.fillText("SOLUCIONES", cx, cy - 2);

                // Texto superior
                if (textoAviso.trim() !== "") {
                    ctx.fillStyle = "rgba(5, 8, 20, 0.9)";
                    ctx.fillRect(40, 50, canvas.width - 80, 140);
                    ctx.strokeStyle = "#00f3ff";
                    ctx.lineWidth = 3;
                    ctx.strokeRect(40, 50, canvas.width - 80, 140);

                    ctx.fillStyle = "#fff";
                    ctx.font = "bold 36px 'Share Tech Mono', monospace";
                    wrapText(ctx, textoAviso, canvas.width / 2, 95, canvas.width - 120, 42);
                }

                const finalizar = () => {
                    const dataUrl = canvas.toDataURL("image/png");
                    guardarAvisoFijo(dataUrl, textoAviso || "Aviso Certificado");
                };

                if (inputLogo.files && inputLogo.files[0]) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const imgLogo = new Image();
                        imgLogo.src = e.target.result;
                        imgLogo.onload = () => {
                            ctx.drawImage(imgLogo, 60, 210, 130, 130);
                            finalizar();
                        };
                        imgLogo.onerror = finalizar;
                    };
                    reader.readAsDataURL(inputLogo.files[0]);
                } else {
                    finalizar();
                }
            };
        });

        function wrapText(context, text, x, y, maxWidth, lineHeight) {
            const words = text.split(' ');
            let line = '';
            for(let n = 0; n < words.length; n++) {
                let testLine = line + words[n] + ' ';
                if (context.measureText(testLine).width > maxWidth && n > 0) {
                    context.fillText(line, x, y);
                    line = words[n] + ' ';
                    y += lineHeight;
                } else {
                    line = testLine;
                }
            }
            context.fillText(line, x, y);
        }

        function guardarAvisoFijo(dataUrl, texto) {
            let guardados = JSON.parse(localStorage.getItem('ventaniya_avisos_fijos')) || [];
            guardados.unshift({ id: Date.now(), imagen: dataUrl, texto: texto });
            localStorage.setItem('ventaniya_avisos_fijos', JSON.stringify(guardados));
            document.getElementById('textoAviso').value = '';
            document.getElementById('logoAvisador').value = '';
            renderizarVidriera();
        }

        function renderizarVidriera() {
            const grid = document.getElementById('estanteGrid');
            grid.innerHTML = ''; 

            let guardados = JSON.parse(localStorage.getItem('ventaniya_avisos_fijos')) || [];
            
            // 1. Mostrar avisos fijos creados
            guardados.forEach((aviso) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div><span class="badge-aviso">⚡ AVISO FIJO GUARDADO</span></div>
                    <div class="img-container"><img src="${aviso.imagen}" alt="Aviso"></div>
                    <div style="font-size: 0.8rem; color: #fff; text-align: left; margin-bottom: 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">💬 ${aviso.texto}</div>
                    <div>
                        <a href="${aviso.imagen}" download="aviso-${aviso.id}.png" class="btn">📥 Descargar Sellado</a>
                        <button class="btn btn-borrar" onclick="borrarAviso(${aviso.id})">🗑️ Borrar de la Vidriera</button>
                    </div>
                `;
                grid.appendChild(card);
            });

            // 2. Mostrar la estampa original del repositorio con su reloj en vivo
            if (estampaRepo) {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div><span class="badge-aviso" style="background: #0077ff;">🖼️ ESTAMPA REPO</span></div>
                    <div class="img-container">
                        <img src="${estampaRepo.download_url}" alt="${estampaRepo.name}">
                        <div class="live-casio-overlay">
                            <div class="casio-time" id="reloj-repo-time">00:00:00.000</div>
                            <div class="casio-date" id="reloj-repo-date">--/--/----</div>
                        </div>
                    </div>
                    <div>
                        <a href="${estampaRepo.download_url}" download="${estampaRepo.name}" class="btn" target="_blank">📥 Descargar Original</a>
                    </div>
                `;
                grid.appendChild(card);
                iniciarReloj('reloj-repo');
            }
        }

        window.borrarAviso = function(id) {
            let guardados = JSON.parse(localStorage.getItem('ventaniya_avisos_fijos')) || [];
            guardados = guardados.filter(a => a.id !== id);
            localStorage.setItem('ventaniya_avisos_fijos', JSON.stringify(guardados));
            renderizarVidriera();
        };

        inicializar();
    </script>
</body>
</html>
